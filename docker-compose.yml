# Ambiente de desenvolvimento local.
#
#   docker compose up -d db            # só o Postgres (suficiente para os testes do worker)
#   docker compose up -d               # Postgres + Evolution API + worker
#
# Em produção o banco é o Supabase; este Postgres serve ao desenvolvimento e
# aos testes, com um shim do schema `auth` para as migrations rodarem iguais.

name: vrf-ecac

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Roda na primeira inicialização, em ordem alfabética.
      - ./supabase/local/00_bootstrap_auth.sql:/docker-entrypoint-initdb.d/00_bootstrap_auth.sql:ro
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./supabase/local/99_apply.sh:/docker-entrypoint-initdb.d/99_apply.sh:ro
      - ./supabase/seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  evolution:
    image: atendai/evolution-api:v2.2.3
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY:-dev-evolution-key}
      DATABASE_ENABLED: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      LOG_LEVEL: ERROR
      DEL_INSTANCE: "false"
    ports:
      - "8080:8080"
    volumes:
      - evolution_data:/evolution/instances
    profiles: ["full"]

  worker:
    build:
      context: ./apps/worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/postgres
      EVOLUTION_BASE_URL: http://evolution:8080
      STORAGE_LOCAL_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - worker_data:/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  db_data:
  evolution_data:
  worker_data:
